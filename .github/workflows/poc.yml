name: SSRF Impact Demo (Safe)

on:
  pull_request:
  workflow_dispatch:

jobs:
  demo:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Show runner info
        run: |
          echo "Workflow is running on GitHub Actions"
          uname -a
          echo "User: $(whoami)"

      - name: GitHub API check (safe)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Calling GitHub API..."
          curl -s -H "Authorization: Bearer $GITHUB_TOKEN" https://api.github.com/user || true
