- name: SSRF + Internal Validation
  run: |
    echo "=== GITHUB TOKEN ==="
    echo "$GITHUB_TOKEN" | cut -c1-20
    
    echo "=== ORIGINAL HEALTH (WORKED) ==="
    curl -k -I https://bb-preprod-api.playtika.com/health
    
    echo "=== ACTUATOR/METRICS ==="
    curl -k -I https://bb-preprod-api.playtika.com/actuator 2>&1 || true
