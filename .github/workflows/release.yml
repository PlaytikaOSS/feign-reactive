name: Publish to Maven Central

on:
  release:
    types: [published]

permissions: {}

jobs:
  release:
    uses: PlaytikaOSS/playtika-workflows/.github/workflows/maven-central-release.yml@66a9a97773cc85395300f855935abc0e169a615b
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    with:
      workflow-sha: 66a9a97773cc85395300f855935abc0e169a615b
      group-id: com.playtika.reactivefeign
      release-branch: develop
      java-version: '21'
      # Required Java CI verifies tests before the release commit is approved.
      skip-tests: true
